pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// Shared code lives in common/ (compiled into both loader jars); each loader has its own module.
rootProject.name = 'handicap'
include 'fabric'
include 'neoforge'
