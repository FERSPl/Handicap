plugins {
	id 'java-library'
	id 'net.neoforged.moddev.legacyforge' version "${moddevgradle_version}"
}

base {
	archivesName = "${mod_id}-forge"
}

version = "${mod_version}+mc${mc_label}"
group = 'com.handicap'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets.main {
	java.srcDirs '../common/src/main/java', '../common/src/client/java'
	resources.srcDirs '../common/src/main/resources', '../common/src/client/resources'
}

sourceSets {
	gametest {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

legacyForge {
	version = "${minecraft_version}-${forge_version}"

	runs {
		client {
			client()
		}
		server {
			server()
			programArgument '--nogui'
		}
		clientSmoke {
			client()
			sourceSet = sourceSets.gametest
			gameDirectory = project.file('run-smoke')
			systemProperty 'handicap.smoke', 'true'
			systemProperty 'handicap.smoke.steps', project.findProperty('smokeSteps') ?: ''
		}
		gameTestServer {
			type = "gameTestServer"
			sourceSet = sourceSets.gametest
			systemProperty 'forge.enabledGameTestNamespaces', mod_id
		}
	}

	addModdingDependenciesTo(sourceSets.gametest)

	mods {
		"${mod_id}" {
			sourceSet(sourceSets.main)
			sourceSet(sourceSets.gametest)
		}
	}
}

mixin {
	add sourceSets.main, "${mod_id}.refmap.json"
	config "${mod_id}.mixins.json"
	config "${mod_id}.client.mixins.json"
}

dependencies {
	annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

processResources {
	filesMatching("*.mixins.json") {
		filter { line -> line.replace('"required": false,', '"required": false,\n\t"refmap": "handicap.refmap.json",') }
	}
	def props = [
		mod_id               : mod_id,
		mod_version          : project.version.toString(),
		forge_min_version    : forge_min_version,
		forge_minecraft_range: forge_minecraft_range,
	]
	inputs.properties props

	filesMatching("META-INF/mods.toml") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

jar {
	manifest {
		attributes('MixinConfigs': "${mod_id}.mixins.json,${mod_id}.client.mixins.json")
	}
	from(rootProject.file('LICENSE')) {
		rename { "${it}_${mod_id}" }
	}
}
