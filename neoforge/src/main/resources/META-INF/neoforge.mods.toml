license="LGPLv3"
issueTrackerURL="https://github.com/FERSPl/Handicap/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="Handicap"
logoFile="assets/handicap/icon.png"
authors="FERSPI"
description='''
Gain a random handicap at regular intervals.
'''

[[mixins]]
config="handicap.mixins.json"

[[mixins]]
config="handicap.client.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_min_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${neo_minecraft_range}"
    ordering="NONE"
    side="BOTH"
