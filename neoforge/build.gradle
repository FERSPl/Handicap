plugins {
	id 'java-library'
	id 'net.neoforged.moddev' version "${moddevgradle_version}"
}

base {
	archivesName = "${mod_id}-neoforge"
}

version = "${mod_version}+mc${mc_label}"
group = 'com.handicap'

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Code shared with the other loaders. NeoForge uses a single source set, so the
// common client code is compiled in too (it is only ever loaded on the client).
sourceSets.main {
	java.srcDirs '../common/src/main/java', '../common/src/client/java'
	resources.srcDirs '../common/src/main/resources', '../common/src/client/resources'
}

neoForge {
	version = project.neo_version

	runs {
		client {
			client()
		}
		server {
			server()
			programArgument '--nogui'
		}
	}

	mods {
		"${mod_id}" {
			sourceSet(sourceSets.main)
		}
	}
}

processResources {
	def props = [
		mod_id             : mod_id,
		mod_version        : project.version.toString(),
		neo_min_version    : neo_min_version,
		neo_minecraft_range: neo_minecraft_range,
	]
	inputs.properties props

	filesMatching("META-INF/neoforge.mods.toml") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

jar {
	from(rootProject.file('LICENSE')) {
		rename { "${it}_${mod_id}" }
	}
}
