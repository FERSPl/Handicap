name: Update badges

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL "https://luken.cc/badges/curseforge/1758595" -o uikit/curseforge-badge.svg
      - run: curl -fsSL "https://luken.cc/badges/modrinth/handicap" -o uikit/modrinth-badge.tmp && mv uikit/modrinth-badge.tmp uikit/modrinth-badge.svg || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uikit/*.svg
          git diff --cached --quiet || git commit -m "Update badges"
          git push
