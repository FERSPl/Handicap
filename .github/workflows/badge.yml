name: Update badges

on:
  schedule:
    - cron: "44 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out
          curl -fsSL "https://luken.cc/badges/curseforge/1758595" -o out/curseforge-badge.svg
          curl -fsSL "https://luken.cc/badges/modrinth/handicap" -o out/modrinth-badge.svg \
            || curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/badges/modrinth-badge.svg" -o out/modrinth-badge.svg \
            || true
      - env:
          TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -b badges
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update badges"
          git push --force "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" badges
