name: release
on:
  push:
    tags: ['[0-9]*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { branch: 26.1, mc: "26.1" }
          - { branch: 26.2, mc: "26.2" }
          - { branch: main,   mc: "26.3" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Collect jars
        run: |
          mkdir dist
          find fabric/build/libs neoforge/build/libs -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-javadoc.jar' \
            -exec cp {} dist/ \;
          ls dist

      - uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.mc }}
          path: dist/*.jar

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tag-source

      - uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1758595
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/handicap-fabric-*.jar
          name: v${{ github.ref_name }}
          version: ${{ github.ref_name }}+mc${{ matrix.mc }}
          version-type: release
          game-versions: ${{ matrix.mc }}
          java: 25
          changelog-file: tag-source/CHANGELOG.md

      - uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1758595
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/handicap-neoforge-*.jar
          name: v${{ github.ref_name }}
          version: ${{ github.ref_name }}+mc${{ matrix.mc }}
          version-type: release
          game-versions: ${{ matrix.mc }}
          java: 25
          changelog-file: tag-source/CHANGELOG.md
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: jars-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Handicap ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: dist/*.jar
