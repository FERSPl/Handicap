plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "${mod_id}-fabric"
}

version = "${mod_version}+mc${mc_label}"
group = 'com.handicap'

loom {
	splitEnvironmentSourceSets()

	mods {
		"handicap" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// code shared with the other loaders.
sourceSets {
	main {
		java.srcDir '../common/src/main/java'
		resources.srcDir '../common/src/main/resources'
	}
	client {
		java.srcDir '../common/src/client/java'
		resources.srcDir '../common/src/client/resources'
	}
}

repositories {
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	def versionValue = project.version
	def mcRange = project.fabric_minecraft_range
	inputs.property "version", versionValue
	inputs.property "minecraft_range", mcRange

	filesMatching("fabric.mod.json") {
		expand "version": versionValue, "minecraft_range": mcRange
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from(rootProject.file('LICENSE')) {
		rename { "${it}_${mod_id}" }
	}
}
